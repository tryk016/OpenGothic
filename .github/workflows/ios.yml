name: iOS CI

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scr0.png'
  push:
    branches: [master, codex/ios-upstream-integration]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scr0.png'
  workflow_dispatch:

# Builds and workflow artifacts do not need repository write access. Release
# publication intentionally lives outside this upstream-safe workflow.
permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhoneOS arm64 (default)
            id: iphoneos-arm64-default
            sdk: iphoneos
            arch: arm64
            three_frames: 'OFF'
            direct_drawable: 'OFF'
            metalfx_spatial: 'OFF'
            metalfx_temporal: 'OFF'
            startup_shaders: 'ON'
          - name: iPhoneSimulator arm64 (default)
            id: iphonesimulator-arm64-default
            sdk: iphonesimulator
            arch: arm64
            three_frames: 'OFF'
            direct_drawable: 'OFF'
            metalfx_spatial: 'OFF'
            metalfx_temporal: 'OFF'
            startup_shaders: 'ON'
          - name: iPhoneOS arm64 (performance)
            id: iphoneos-arm64-performance
            sdk: iphoneos
            arch: arm64
            three_frames: 'ON'
            direct_drawable: 'ON'
            metalfx_spatial: 'ON'
            metalfx_temporal: 'ON'
            startup_shaders: 'ON'
          - name: iPhoneOS arm64 (runtime startup fallback)
            id: iphoneos-arm64-startup-fallback
            sdk: iphoneos
            arch: arm64
            three_frames: 'OFF'
            direct_drawable: 'OFF'
            metalfx_spatial: 'OFF'
            metalfx_temporal: 'OFF'
            startup_shaders: 'OFF'

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build tools
        run: brew install cmake glslang

      - name: Configure (Xcode generator)
        run: |
          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=${{ matrix.sdk }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DOPENGOTHIC_IOS_VERSION="1.0.${{ github.run_number }}" \
            -DOPENGOTHIC_IOS_THREE_FRAMES_IN_FLIGHT=${{ matrix.three_frames }} \
            -DOPENGOTHIC_IOS_DIRECT_DRAWABLE=${{ matrix.direct_drawable }} \
            -DOPENGOTHIC_METALFX_SPATIAL=${{ matrix.metalfx_spatial }} \
            -DOPENGOTHIC_METALFX_TEMPORAL=${{ matrix.metalfx_temporal }} \
            -DOPENGOTHIC_IOS_PRECOMPILED_STARTUP_SHADERS=${{ matrix.startup_shaders }}

      - name: Build (code signing disabled)
        run: |
          cmake --build build-ios --config Release --target Gothic2Notr -- \
            -sdk ${{ matrix.sdk }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned application
        env:
          PROFILE_ID: ${{ matrix.id }}
          SDK_NAME: ${{ matrix.sdk }}
        run: |
          APP="$(find build-ios -name '*.app' -type d -print -quit)"
          if [ -z "$APP" ]; then
            echo "No .app bundle was produced"
            exit 1
          fi

          APP_NAME="$(basename "$APP")"
          rm -rf package
          mkdir -p package
          if [ "$SDK_NAME" = "iphoneos" ]; then
            mkdir -p package/Payload
            ditto "$APP" "package/Payload/$APP_NAME"
            (cd package && zip -qry -y "$GITHUB_WORKSPACE/OpenGothic-$PROFILE_ID.ipa" Payload)
          else
            ditto "$APP" "package/$APP_NAME"
          fi

      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenGothic-${{ matrix.id }}
          path: |
            OpenGothic-${{ matrix.id }}.ipa
            package/*.app
          if-no-files-found: error
          retention-days: 14
