name: Android build

on:
  push:
    branches: [android]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install host shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          glslangValidator --version

      - name: Build signed migration APK
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleRelease -PbuildNum=${{ github.run_number }}

      - name: Verify native libraries
        run: |
          set -Eeuo pipefail
          mapfile -t apks < <(find android -type f -name '*-release.apk' -print | sort)
          if (( ${#apks[@]} != 1 )); then
            echo "::error title=Unexpected APK count::Expected one release APK, found ${#apks[@]}."
            exit 1
          fi

          APK="${apks[0]}"
          unzip -l "$APK" | tee apk-contents.txt
          grep -q 'lib/arm64-v8a/libGothic2Notr.so' apk-contents.txt
          grep -q 'lib/x86_64/libGothic2Notr.so' apk-contents.txt
          cp -- "$APK" OpenGothic-migration.apk

      # Migration builds stay as CI artifacts. The rolling latest-android
      # release is re-enabled only after boot-to-menu and device lifecycle
      # parity with the previous port have both passed.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenGothic-android-migration
          path: OpenGothic-migration.apk
          if-no-files-found: error
