name: Android build

on:
  push:
    branches: [android]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install host shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools
          glslangValidator --version
          spirv-val --version

      - name: Build signed migration APK
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleRelease -PbuildNum=${{ github.run_number }}

      - name: Validate generated shaders
        run: |
          set -Eeuo pipefail
          shader_root="android/app/.cxx"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          for abi in arm64-v8a x86_64; do
            mapfile -d '' -t shaders < <(
              find "$shader_root" -type f -path "*/${abi}/*" \
                \( -name '*_slot.*.sprv' -o -name 'main_pfx*.frag.sprv' \
                   -o -name 'fsr1_*.frag.sprv' \) \
                -print0 | sort -z
              )
            if (( ${#shaders[@]} == 0 )); then
              echo "::error title=Missing ${abi} shaders::No validation-target shaders were generated."
              exit 1
            fi

            slot_count=0
            has_easu=false
            has_rcas=false
            for shader in "${shaders[@]}"; do
              spirv-val "$shader"
              case "$(basename "$shader")" in
                fsr1_easu.frag.sprv) has_easu=true ;;
                fsr1_rcas.frag.sprv) has_rcas=true ;;
                *)
                  ((slot_count+=1))
                  disassembly="$temp_dir/shader.spvasm"
                  spirv-dis "$shader" -o "$disassembly"
                  if grep -qE 'OpCapability[[:space:]]+(RuntimeDescriptorArray(EXT)?|ShaderNonUniform(EXT)?)([[:space:]]|$)' "$disassembly"; then
                    echo "::error file=${shader},title=Forbidden slot capability::Slot shader requires bindless descriptor indexing."
                    exit 1
                  fi
                  ;;
              esac
            done
            if (( slot_count == 0 )) || ! $has_easu || ! $has_rcas; then
              echo "::error title=Incomplete ${abi} shader set::Expected slot, FSR1 EASU, and FSR1 RCAS shaders."
              exit 1
            fi
            echo "Validated ${#shaders[@]} ${abi} shaders."
          done

      - name: Verify native libraries
        run: |
          set -Eeuo pipefail
          mapfile -t apks < <(find android -type f -name '*-release.apk' -print | sort)
          if (( ${#apks[@]} != 1 )); then
            echo "::error title=Unexpected APK count::Expected one release APK, found ${#apks[@]}."
            exit 1
          fi

          APK="${apks[0]}"
          unzip -l "$APK" | tee apk-contents.txt
          grep -q 'lib/arm64-v8a/libGothic2Notr.so' apk-contents.txt
          grep -q 'lib/x86_64/libGothic2Notr.so' apk-contents.txt
          cp -- "$APK" OpenGothic-migration.apk

      # Migration builds stay as CI artifacts. The rolling latest-android
      # release remains a WIP until the memory, GPU-compatibility, and
      # performance gates have passed on physical devices.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenGothic-android-migration
          path: OpenGothic-migration.apk
          if-no-files-found: error
